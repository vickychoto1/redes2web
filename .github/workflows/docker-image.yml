name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Login
        if: github.event_name == 'push'
        env:
          DOCKER_PASSWORD: ${{ secrets.TOKEN_DE_ACCESO }}
        run: |
          echo "Iniciando login"
          echo "$DOCKER_PASSWORD" | docker login -u "vicky2606" --password-stdin
          echo "Fin de login"

      - name: Build Docker Image
        run: |
          docker build -t vicky2606/redes2:flaskv2 .

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push vicky2606/redes2:flaskv2
